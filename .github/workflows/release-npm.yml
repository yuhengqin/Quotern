name: npm release publication

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub Release tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

# Serialize registry writes across versions, including retries after a partial publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Resolve an existing published Release for manual publication
        id: manual
        if: github.event_name == 'workflow_dispatch'
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          const { appendFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          async function main() {
            const tag = process.env.REQUESTED_TAG;
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag ?? '')) throw new Error('A versioned Release tag is required');
            async function api(path) {
              const response = await fetch(process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY + path, {
                headers: { authorization: 'Bearer ' + process.env.GH_TOKEN, accept: 'application/vnd.github+json' },
                signal: AbortSignal.timeout(30_000),
              });
              if (!response.ok) throw new Error('Cannot resolve published Release: GitHub HTTP ' + response.status);
              return response.json();
            }
            const release = await api('/releases/tags/' + encodeURIComponent(tag));
            if (release.tag_name !== tag || release.draft !== false || typeof release.published_at !== 'string' || !release.published_at.trim()) {
              throw new Error('Manual npm publication requires the requested, already published GitHub Release');
            }
            let reference = (await api('/git/ref/tags/' + encodeURIComponent(tag))).object;
            for (let depth = 0; reference?.type === 'tag' && depth < 8; depth++) {
              if (!/^[a-f0-9]{40}$/i.test(reference.sha ?? '')) throw new Error('Invalid Release tag object');
              reference = (await api('/git/tags/' + reference.sha)).object;
            }
            if (reference?.type !== 'commit' || !/^[a-f0-9]{40}$/i.test(reference.sha ?? '')) throw new Error('Release tag must resolve to a commit');
            writeFileSync(join(process.env.RUNNER_TEMP, 'npm-release-event.json'), JSON.stringify({ action: 'published', release }));
            appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\ncommit=' + reference.sha + '\n');
            console.log('Verified published Release ' + tag + ' at ' + reference.sha);
          }
          main().catch(error => { console.error(error.message); process.exitCode = 1; });
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.manual.outputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published Release source and select npm channel
        id: source
        env:
          MANUAL_RELEASE_TAG: ${{ steps.manual.outputs.tag }}
          MANUAL_RELEASE_COMMIT: ${{ steps.manual.outputs.commit }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            GITHUB_EVENT_NAME=release GITHUB_EVENT_PATH="$RUNNER_TEMP/npm-release-event.json" \
              GITHUB_REF="refs/tags/$MANUAL_RELEASE_TAG" GITHUB_SHA="$MANUAL_RELEASE_COMMIT" \
              node scripts/npm-release.mjs --preflight
          else
            node scripts/npm-release.mjs --preflight
          fi
      - uses: pnpm/action-setup@v6
      - run: corepack pnpm install --frozen-lockfile --prefer-offline
      - name: Test release guards and build CLI with its Dashboard
        run: |
          corepack pnpm test:release
          corepack pnpm build:cli
          corepack pnpm --filter quotern-core --filter quotern-i18n --filter quotern -r test
      - name: Verify packed files and install them outside the workspace
        run: corepack pnpm check:npm-release --output "$RUNNER_TEMP/npm-packages"
      - name: Publish new npm package versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.source.outputs.npm-tag }}
        run: |
          set -euo pipefail
          : "${NODE_AUTH_TOKEN:?Configure the repository NPM_TOKEN secret with npm publication permission}"
          corepack pnpm check:npm-release --check-latest
          corepack pnpm --filter quotern-core --filter quotern-i18n --filter quotern -r publish --no-git-checks --access public --tag "$NPM_DIST_TAG" --report-summary
          corepack pnpm check:npm-release --promote-latest
      - name: Verify exact published versions from the public registry
        run: corepack pnpm check:npm-release --registry-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-release-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/npm-packages/*
            pnpm-publish-summary.json
