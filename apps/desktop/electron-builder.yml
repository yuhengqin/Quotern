appId: dev.quotern.desktop
productName: Quotern
publish:
  provider: github
  owner: yuhengqin
  repo: Quotern
  private: true
afterPack: ./scripts/after-pack.cjs
# Sharp uses prebuilt Node-API binaries; preserve its complete platform package instead of ABI rebuilding.
# Other JS dependencies are bundled by electron-vite; the decoder closure is staged separately.
npmRebuild: false
# Drop leftover workspace sources from the asar to keep release archives small.
compression: maximum
directories:
  output: release/${version}
  buildResources: resources
files:
  - "!**/*"
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - THIRD_PARTY_NOTICES.md
  - resources/**/*
  - from: out/native-runtime
    to: node_modules
    filter:
      - "**/*"
asar: true
asarUnpack:
  - out/main/sync-worker*.js
  - out/native-runtime/**
extraResources:
  - from: out/dsh-pet
    to: dsh-pet
    filter:
      - "**/*"
  - from: resources
    filter:
      - quoternTemplate.png
      - quoternTemplate@2x.png
      - icon.png
      - icon-512.png
    to: resources
mac:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  forceCodeSigning: true
  type: distribution
  icon: resources/icon.png
  electronLanguages:
    - zh-CN
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
dmg:
  format: UDBZ
  sign: true
nsis:
  # Keep the installed application's upgrade identity while changing its product name/appId.
  guid: 77c89c13-52a6-5b46-b7b1-f5b025d10759
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
  include: scripts/installer.nsh
  installerLanguages:
    - en_US
    - zh_CN
    - ja_JP
    - ko_KR
  displayLanguageSelector: true
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
  buildUniversalInstaller: false
win:
  icon: resources/icon.png
  electronLanguages:
    - zh-CN
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
