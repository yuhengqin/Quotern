[package]
name = "quotern-desktop"
version = "1.0.0"
edition = "2021"
publish = false

[[bin]]
name = "Quotern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "rt-multi-thread", "macros"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_UI_WindowsAndMessaging"] }
