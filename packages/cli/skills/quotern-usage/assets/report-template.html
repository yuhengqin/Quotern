<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>{{TITLE}} · Quotern</title>
  <style>
    :root { color-scheme: light dark; --page: #f4f5f2; --surface: #fff; --ink: #182b34; --muted: #586b73; --line: #d9e1df; --accent: #0d7669; --accent-soft: #e8f5ef; --notice: #fff4d6; --notice-ink: #72501c; --track: #e9eeeb; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--page); font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-inline-size: 1100px; margin-inline: auto; padding: 48px 28px 64px; }
    a { color: var(--accent); text-underline-offset: 4px; }
    a:focus-visible, summary:focus-visible, .table-wrapper:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-block-end: 36px; font-weight: 750; letter-spacing: .08em; }
    .brand-mark { display: grid; place-items: center; inline-size: 34px; block-size: 34px; border-radius: 11px; color: white; background: var(--accent); font-size: 20px; }
    .brand small { margin-inline-start: auto; font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: .03em; }
    .eyebrow { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .08em; }
    h1 { margin: 0 0 14px; font-size: clamp(28px, 4vw, 42px); line-height: 1.25; letter-spacing: -.04em; overflow-wrap: anywhere; }
    h2 { margin: 0; font-size: 20px; line-height: 1.45; letter-spacing: -.02em; }
    h3 { margin: 0 0 7px; font-size: 16px; line-height: 1.5; }
    p { margin: 0 0 12px; }
    .muted, small { color: var(--muted); }
    .period { color: var(--muted); font-size: 14px; }
    .scope { margin: 0 0 24px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .overview { max-inline-size: 780px; margin: 24px 0; font-size: 18px; line-height: 1.9; }
    .notice { padding: 14px 18px; border-radius: 12px; color: var(--notice-ink); background: var(--notice); font-size: 14px; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 28px 0 38px; }
    .metric { padding: 22px 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); min-inline-size: 0; }
    .metric:first-child { border-color: var(--accent); background: var(--accent-soft); }
    .metric-value { margin: 0 0 6px; font-size: clamp(24px, 3.1vw, 35px); font-weight: 750; line-height: 1.35; letter-spacing: -.035em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .metric .muted { margin: 0; font-size: 12px; }
    .section { padding: 28px; margin-block-end: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .section-heading { display: flex; align-items: center; gap: 12px; margin-block-end: 20px; }
    .section-number { font-size: 12px; color: var(--accent); font-weight: 750; }
    .findings { display: grid; gap: 20px; }
    .findings article { border-inline-start: 3px solid var(--accent); padding-inline-start: 18px; }
    .findings article p { margin: 0; color: var(--muted); }
    .bars { display: grid; gap: 17px; list-style: none; margin: 24px 0 0; padding: 0; }
    .bar-label { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-block-end: 7px; }
    .bar-label > span { overflow-wrap: anywhere; }
    .bar-label small { margin-inline-start: 10px; font-size: 12px; font-weight: 400; }
    .bar-label strong { white-space: nowrap; font-size: 13px; font-variant-numeric: tabular-nums; }
    .bar-track { overflow: hidden; block-size: 9px; border-radius: 8px; background: var(--track); }
    .bar-track span { display: block; block-size: 100%; border-radius: inherit; background: var(--accent); }
    .timeline { display: block; inline-size: 100%; margin-block-start: 18px; overflow: visible; }
    .timeline rect { fill: var(--accent); }
    .timeline line { stroke: var(--line); stroke-width: 1; }
    .timeline text { fill: var(--muted); font-size: 11px; }
    summary { cursor: pointer; font-size: 17px; font-weight: 650; }
    summary small { font-size: 13px; font-weight: 400; margin-inline-start: 8px; }
    details[open] > summary { margin-block-end: 20px; }
    .table-wrapper { max-inline-size: 100%; max-block-size: 660px; overflow: auto; container-type: inline-size; }
    table { inline-size: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    caption { padding: 0 0 16px; text-align: start; color: var(--muted); font-size: 12px; }
    th, td { padding: 13px 12px; border-block-end: 1px solid var(--line); text-align: start; vertical-align: top; }
    thead { position: sticky; inset-block-start: 0; z-index: 2; }
    thead th { color: var(--muted); font-weight: 550; background: var(--surface); white-space: nowrap; }
    tbody th { position: sticky; inset-inline-start: 0; z-index: 1; max-inline-size: 320px; min-inline-size: 150px; overflow-wrap: anywhere; font-weight: 550; background: var(--surface); }
    .number { white-space: nowrap; text-align: end; font-variant-numeric: tabular-nums; }
    .composition { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .composition div { padding: 15px; background: var(--page); border-radius: 10px; }
    .composition dt { color: var(--muted); font-size: 12px; }
    .composition dd { margin: 7px 0 0; font-weight: 650; font-variant-numeric: tabular-nums; }
    .composition small { font-size: 12px; }
    .notes { margin: 16px 0 0; padding-inline-start: 22px; color: var(--muted); font-size: 13px; }
    .notes li + li { margin-block-start: 10px; }
    .empty { padding: 20px 0; color: var(--muted); }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; padding: 10px 2px; color: var(--muted); font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      :root { --page: #101c22; --surface: #17272f; --ink: #edf4f1; --muted: #b1c2c7; --line: #34464e; --accent: #69d9ba; --accent-soft: #16392f; --notice: #423719; --notice-ink: #f5d990; --track: #34464e; }
      .brand-mark { color: #10251e; }
    }
    @media (max-width: 650px) {
      main { padding: 26px 16px 40px; }
      .brand { margin-block-end: 26px; }
      .brand small { display: none; }
      .metrics { grid-template-columns: 1fr; gap: 10px; margin: 24px 0; }
      .metric { padding: 18px 20px; }
      .section { padding: 20px; border-radius: 14px; }
      .composition { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      footer { flex-direction: column; gap: 4px; }
      .bar-label small { display: block; margin-inline-start: 0; }
    }
    @media print {
      :root { color-scheme: light; --page: #fff; --surface: #fff; --ink: #182b34; --muted: #586b73; --line: #d9e1df; --accent: #0d7669; --accent-soft: #e8f5ef; }
      main { max-inline-size: none; padding: 0; }
      .section, .metric { break-inside: avoid; }
      .table-wrapper { max-block-size: none; overflow: visible; }
      thead, tbody th { position: static; }
      details::details-content { content-visibility: visible; }
      footer a { display: none; }
    }
  </style>
</head>
<body>
  <main id="top">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">Q</span>QUOTERN <small>本地用量报告</small></div>
      <p class="eyebrow">{{PERIOD}}</p>
      <h1>{{TITLE}}</h1>
      <p class="period">{{RANGE}} · {{ZONE}}</p>
      <p class="scope">{{SCOPE}}</p>
      {{OVERVIEW}}
      {{WARNINGS}}
    </header>
    <section class="metrics" aria-label="用量总览">{{METRICS}}</section>
    {{FINDINGS}}
    <section class="section" aria-labelledby="chart-title">
      <div class="section-heading"><span class="section-number">02</span><h2 id="chart-title">用量分布</h2></div>
      {{CHART}}
    </section>
    <details class="section" open>
      <summary>完整明细 <small>{{COUNT}} 项 · 点击收起或展开</small></summary>
      {{DETAIL}}
    </details>
    {{COMPOSITION}}
    <details class="section"><summary>统计口径与数据说明</summary>{{NOTES}}</details>
    {{NEXT_STEPS}}
    <footer><span>Quotern · 本地生成的独立报告</span>{{ATTRIBUTION}}<a href="#top">返回顶部 ↑</a></footer>
  </main>
</body>
</html>
