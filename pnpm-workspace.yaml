packages:
  - 'packages/*'
  - 'apps/*'
enableGlobalVirtualStore: true
packageExtensions:
  # HeroUI imports this package without declaring it; GVS cannot rely on hoisting.
  '@heroui/react@3.2.4':
    dependencies:
      '@internationalized/date': 3.12.3
  'electron-vite@5.0.0':
    dependencies:
      electron: 35.4.0
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
overrides:
  '@heroui/react': 3.2.4
  '@heroui/styles': 3.2.4
  tailwind-variants: 3.3.1
allowBuilds:
  electron: true
  esbuild: true
  protobufjs: false
